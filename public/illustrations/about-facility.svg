<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t2 d2">
  <title id="t2">Abstract facility illustration</title>
  <desc id="d2">Stylized production-line grid representing the manufacturing facility.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0B2E33" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg2)" />

  <!-- roofline -->
  <path d="M0 140 L160 60 L320 140 Z" fill="#00606E" opacity="0.5" />
  <path d="M300 150 L460 70 L620 150 Z" fill="#00606E" opacity="0.35" />

  <!-- facade grid: rows of "windows" / blister cavities -->
  <g fill="#7DDEE8" opacity="0.28">
    <rect x="40" y="170" width="720" height="260" rx="8" fill="#0B2E33" stroke="#7DDEE8" stroke-opacity="0.25" />
  </g>
  <g fill="#7DDEE8">
    <!-- generate grid manually -->
    <g opacity="0.55">
      <rect x="70" y="200" width="36" height="46" rx="4" />
      <rect x="120" y="200" width="36" height="46" rx="4" />
      <rect x="170" y="200" width="36" height="46" rx="4" />
      <rect x="220" y="200" width="36" height="46" rx="4" />
      <rect x="270" y="200" width="36" height="46" rx="4" />
      <rect x="320" y="200" width="36" height="46" rx="4" />
      <rect x="370" y="200" width="36" height="46" rx="4" />
      <rect x="420" y="200" width="36" height="46" rx="4" />
      <rect x="470" y="200" width="36" height="46" rx="4" />
      <rect x="520" y="200" width="36" height="46" rx="4" />
      <rect x="570" y="200" width="36" height="46" rx="4" />
      <rect x="620" y="200" width="36" height="46" rx="4" />
      <rect x="670" y="200" width="36" height="46" rx="4" />
      <rect x="720" y="200" width="36" height="46" rx="4" />
    </g>
    <g opacity="0.3">
      <rect x="70" y="270" width="36" height="46" rx="4" />
      <rect x="120" y="270" width="36" height="46" rx="4" />
      <rect x="170" y="270" width="36" height="46" rx="4" />
      <rect x="220" y="270" width="36" height="46" rx="4" />
      <rect x="270" y="270" width="36" height="46" rx="4" />
      <rect x="320" y="270" width="36" height="46" rx="4" />
      <rect x="370" y="270" width="36" height="46" rx="4" />
      <rect x="420" y="270" width="36" height="46" rx="4" />
      <rect x="470" y="270" width="36" height="46" rx="4" />
      <rect x="520" y="270" width="36" height="46" rx="4" />
      <rect x="570" y="270" width="36" height="46" rx="4" />
      <rect x="620" y="270" width="36" height="46" rx="4" />
      <rect x="670" y="270" width="36" height="46" rx="4" />
      <rect x="720" y="270" width="36" height="46" rx="4" />
    </g>
  </g>

  <!-- ground line -->
  <rect x="0" y="430" width="800" height="70" fill="#0B2E33" />
  <rect x="0" y="428" width="800" height="2" fill="#F47920" opacity="0.6" />

  <!-- status light -->
  <circle cx="742" cy="222" r="6" fill="#F47920" />
</svg>
