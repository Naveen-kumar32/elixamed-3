<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600" role="img" aria-labelledby="t1 d1">
  <title id="t1">Abstract editorial illustration</title>
  <desc id="d1">Geometric capsule and molecule-lattice composition in the ElixaMed brand palette.</desc>
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B2E33" />
      <stop offset="100%" stop-color="#00606E" />
    </linearGradient>
    <linearGradient id="capsule1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F47920" />
      <stop offset="100%" stop-color="#7DDEE8" />
    </linearGradient>
    <pattern id="dots1" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#7DDEE8" opacity="0.35" />
    </pattern>
  </defs>

  <rect width="480" height="600" fill="url(#bg1)" />
  <rect width="480" height="600" fill="url(#dots1)" />

  <g opacity="0.9" transform="rotate(-18 240 300)">
    <rect x="120" y="180" width="240" height="120" rx="60" fill="none" stroke="url(#capsule1)" stroke-width="3" />
    <rect x="120" y="180" width="120" height="120" rx="60" fill="#F47920" opacity="0.18" />
    <rect x="240" y="180" width="120" height="120" rx="60" fill="#7DDEE8" opacity="0.18" />
  </g>

  <circle cx="360" cy="140" r="10" fill="#F47920" />
  <circle cx="110" cy="460" r="6" fill="#7DDEE8" />
  <circle cx="150" cy="440" r="3" fill="#7DDEE8" />
  <line x1="110" y1="460" x2="150" y2="440" stroke="#7DDEE8" stroke-width="1.5" opacity="0.6" />

  <g opacity="0.5">
    <circle cx="80" cy="120" r="3" fill="#FEF3EA" />
    <circle cx="100" cy="95" r="2" fill="#FEF3EA" />
    <line x1="80" y1="120" x2="100" y2="95" stroke="#FEF3EA" stroke-width="1" />
  </g>
</svg>
