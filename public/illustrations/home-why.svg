<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" role="img" aria-labelledby="t3 d3">
  <title id="t3">Abstract editorial illustration</title>
  <desc id="d3">Layered capsule and tablet shapes in the ElixaMed brand palette on a light surface.</desc>
  <defs>
    <radialGradient id="blob1" cx="30%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#FEF3EA" />
      <stop offset="100%" stop-color="#FEF3EA" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="blob2" cx="80%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#E9F8FA" />
      <stop offset="100%" stop-color="#E9F8FA" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="600" height="700" fill="#FAFAF8" />
  <rect width="600" height="700" fill="url(#blob1)" />
  <rect width="600" height="700" fill="url(#blob2)" />

  <g transform="rotate(-12 300 330)">
    <rect x="160" y="270" width="280" height="120" rx="60" fill="none" stroke="#00606E" stroke-width="3" />
    <rect x="160" y="270" width="140" height="120" rx="60" fill="#00ABC2" opacity="0.14" />
  </g>

  <circle cx="420" cy="200" r="46" fill="none" stroke="#B34E09" stroke-width="2.5" opacity="0.5" />
  <circle cx="420" cy="200" r="10" fill="#F47920" />

  <g stroke="#334155" stroke-opacity="0.15">
    <line x1="90" y1="520" x2="510" y2="520" />
    <line x1="90" y1="560" x2="430" y2="560" />
  </g>

  <circle cx="130" cy="150" r="4" fill="#00ABC2" />
  <circle cx="160" cy="130" r="2.5" fill="#00ABC2" />
  <line x1="130" y1="150" x2="160" y2="130" stroke="#00ABC2" stroke-width="1.2" opacity="0.6" />
</svg>
